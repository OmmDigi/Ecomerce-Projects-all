upstream api_servers_c2 {
    server 127.0.0.1:4006;
}

upstream upload_servers_c2 {
    server 127.0.0.1:5006;
}

server {
    listen 80;
    server_name c2.ommnews.in www.c2.ommnews.in crm-c2.ommnews.in api-c2.ommnews.in upload-c2.ommnews.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name c2.ommnews.in;

    ssl_certificate /etc/letsencrypt/live/c2.ommnews.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/c2.ommnews.in/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for streaming support
        proxy_buffering off;
        proxy_set_header X-Accel-Buffering no;
    }
}

