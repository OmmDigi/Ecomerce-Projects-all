version: "3.8"

networks:
  custom_network:
    driver: bridge

services:
  api_1:
    build: ./api
    container_name: api_1
    expose:
      - "3000"
    env_file:
      - ./api/${ENV_NAME}
    depends_on:
      - c1_postgres_1
    volumes: 
      - ./logs/api-logs:/app/logs
    networks:
      - custom_network

  upload_api_1:
    build: ./upload
    container_name: upload_api_1
    expose:
      - "3000"
    env_file:
      - ./upload/${ENV_NAME}
    volumes:
      - ./uploaded-files/uploads:/app/uploads
      - ./uploaded-files/private:/app/private
    depends_on:
      - c1_postgres_1
    networks:
      - custom_network

  c1_postgres_1:
    image: postgres:17.4
    container_name: c1_postgres_1
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - custom_network

  nginx_1:
    image: nginx:latest
    container_name: nginx_1
    ports:
      - "9000:8080"
      - "9001:8081"
    volumes:
      # - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/${NGINX_CONF_FILE_NAME}:/etc/nginx/conf.d/default.conf
    depends_on:
      - api_1
      - upload_api_1
    networks:
      - custom_network

volumes:
  db_data:
